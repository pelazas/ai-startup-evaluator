services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: crag-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crag_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crag_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
